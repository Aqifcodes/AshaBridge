version: "3.9"

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./healthcare.db
      - SECRET_KEY=change-in-production
      - DEBUG=true
    volumes:
      - ../backend:/app/backend
    restart: unless-stopped

