<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hospital Dashboard — Rural Referral System</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #7d8590; --accent: #238636;
    --critical: #da3633; --high: #e3632e; --medium: #d4a017; --low: #3fb950;
    --blue: #1f6feb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  .ws-status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.85rem; color: var(--muted); }
  .ws-dot { width: 10px; height: 10px; border-radius: 50%; background: #555; }
  .ws-dot.connected { background: var(--low); box-shadow: 0 0 6px var(--low); }

  .layout { display: grid; grid-template-columns: 1fr 380px; height: calc(100vh - 60px); }

  /* Left panel */
  .main-panel { padding: 1.5rem; overflow-y: auto; }
  .stats-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.2rem; }
  .stat-card .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .stat-card .value { font-size: 2rem; font-weight: 700; margin-top: 0.3rem; }
  .stat-card.critical .value { color: var(--critical); }
  .stat-card.high .value { color: var(--high); }
  .stat-card.medium .value { color: var(--medium); }
  .stat-card.total .value { color: var(--blue); }

  .section-title { font-size: 0.9rem; font-weight: 600; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .05em; }

  .referral-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .referral-table th { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.75rem 1rem; text-align: left; color: var(--muted); font-weight: 500; font-size: 0.78rem; text-transform: uppercase; }
  .referral-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .referral-table tr:hover td { background: rgba(255,255,255,0.03); }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
  .badge.CRITICAL { background: rgba(218,54,51,0.15); color: var(--critical); border: 1px solid var(--critical); }
  .badge.HIGH     { background: rgba(227,99,46,0.15);  color: var(--high);     border: 1px solid var(--high); }
  .badge.MEDIUM   { background: rgba(212,160,23,0.15); color: var(--medium);   border: 1px solid var(--medium); }
  .badge.LOW      { background: rgba(63,185,80,0.15);  color: var(--low);      border: 1px solid var(--low); }
  .status-badge { padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; background: rgba(255,255,255,0.08); color: var(--text); }

  .btn-accept { background: var(--accent); border: none; color: #fff; padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
  .btn-accept:hover { opacity: 0.85; }

  /* Right panel — alert feed */
  /* --- NEW UI FOR RIGHT PANEL --- */
  .availability-box {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--border);
    background: rgba(255,255,255,0.02);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .availability-select {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.4rem 0.8rem;
    border-radius: 4px;
    font-size: 0.85rem;
    outline: none;
    cursor: pointer;
  }
  
  .action-buttons {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.85rem;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 0.75rem;
  }
  .btn-icon {
    flex: 1;
    padding: 0.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
  }
  .btn-icon.accept { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid #238636; }
  .btn-icon.accept:hover { background: rgba(35, 134, 54, 0.4); }
  
  .btn-icon.reject { background: rgba(218, 54, 51, 0.2); color: #ff7b72; border: 1px solid #da3633; }
  .btn-icon.reject:hover { background: rgba(218, 54, 51, 0.4); }
  
  .doc-info { float: right; font-size: 0.75rem; color: var(--text); background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; }
  .alert-panel { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
  .alert-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .alert-header span { font-size: 0.9rem; font-weight: 600; }
  .alert-count { background: var(--critical); color: #fff; font-size: 0.7rem; padding: 1px 7px; border-radius: 20px; }
  .alert-feed { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .alert-card { border: 1px solid var(--border); border-radius: 8px; padding: 1rem; animation: slideIn 0.3s ease; }
  .alert-card.CRITICAL { border-left: 4px solid var(--critical); background: rgba(218,54,51,0.07); }
  .alert-card.HIGH     { border-left: 4px solid var(--high);     background: rgba(227,99,46,0.07); }
  .alert-card.MEDIUM   { border-left: 4px solid var(--medium);   background: rgba(212,160,23,0.07); }
  .alert-card.LOW      { border-left: 4px solid var(--low);      background: rgba(63,185,80,0.07); }
  .alert-card .ticket  { font-size: 0.72rem; color: var(--muted); margin-bottom: 0.4rem; }
  .alert-card .patient-name { font-weight: 600; font-size: 0.95rem; }
  .alert-card .detail  { font-size: 0.8rem; color: var(--muted); margin-top: 0.25rem; }
  .alert-card .action-text { font-size: 0.78rem; margin-top: 0.5rem; padding: 0.4rem 0.6rem; border-radius: 4px; background: rgba(255,255,255,0.06); }
  .alert-card .alert-time { font-size: 0.7rem; color: var(--muted); margin-top: 0.5rem; }
  .alert-card .icu-tag { display: inline-block; background: rgba(218,54,51,0.2); color: var(--critical); border: 1px solid var(--critical); font-size: 0.68rem; padding: 1px 6px; border-radius: 3px; margin-top: 0.3rem; }

  @keyframes slideIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform:none; } }

  /* Config bar */
  .config-bar { padding: 1rem 1.25rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; align-items: center; }
  .config-bar input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 4px; font-size: 0.82rem; }
  .config-bar button { background: var(--blue); border: none; color: #fff; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.82rem; }

  .empty-state { text-align: center; color: var(--muted); padding: 2rem; font-size: 0.85rem; }
</style>
</head>
<body>

<header>
  <h1>🏥 Hospital Dashboard — Rural Referral System</h1>
  <div class="ws-status">
    <div class="ws-dot" id="wsDot"></div>
    <span id="wsLabel">Disconnected</span>
  </div>
</header>

<div class="layout">
  <!-- Main -->
  <div class="main-panel">
    <div class="stats-row">
      <div class="stat-card critical"><div class="label">Critical</div><div class="value" id="statCritical">0</div></div>
      <div class="stat-card high"><div class="label">High</div><div class="value" id="statHigh">0</div></div>
      <div class="stat-card medium"><div class="label">Medium</div><div class="value" id="statMedium">0</div></div>
      <div class="stat-card total"><div class="label">Total Today</div><div class="value" id="statTotal">0</div></div>
    </div>

    <div class="section-title">Incoming Referrals</div>
    <table class="referral-table">
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Patient</th>
          <th>Village</th>
          <th>Condition</th>
          <th>Priority</th>
          <th>Specialist</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="referralTableBody">
        <tr><td colspan="8" class="empty-state">Waiting for referrals...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Alert Panel -->
  <div class="alert-panel">
    <!-- BOX 1: Availability -->
    <div class="availability-box">
      <span style="font-size: 0.9rem; font-weight: 600;">Status</span>
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <select class="availability-select" id="hospitalAvailability">
          <option value="available">🟢 Available</option>
          <option value="not_available">🔴 Not Available</option>
        </select>
        <span id="availabilityTick" style="font-size:1.1rem;">✅</span>
      </div>
    </div>

    <!-- BOX 2: Live Alerts Feed -->
    <div class="alert-header">
      <span>🔔 Live Alerts</span>
      <span class="alert-count" id="alertCount">0</span>
    </div>
    <div class="alert-feed" id="alertFeed">
      <div class="empty-state">Connect to start receiving alerts</div>
    </div>
    <div class="config-bar">
      <input id="hospitalIdInput" placeholder="Hospital ID (e.g. HOSP001)" value="HOSP001"/>
      <button onclick="connectWS()">Connect</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:8000';
  let ws = null;
  let referrals = [];
  let alertCount = 0;

  const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, TOTAL: 0 };

  function connectWS() {
    const hid = document.getElementById('hospitalIdInput').value.trim() || 'HOSP001';
    if (ws) ws.close();
    ws = new WebSocket(`ws://localhost:8000/ws/hospital/${hid}`);

    ws.onopen = () => {
      document.getElementById('wsDot').classList.add('connected');
      document.getElementById('wsLabel').textContent = `Connected · ${hid}`;
    };
    ws.onmessage = (e) => {
      const msg = JSON.parse(e.data);
      if (msg.type === 'NEW_REFERRAL') handleNewReferral(msg);
      if (msg.type === 'STATUS_UPDATE') handleStatusUpdate(msg);
    };
    ws.onclose = () => {
      document.getElementById('wsDot').classList.remove('connected');
      document.getElementById('wsLabel').textContent = 'Disconnected';
    };
    ws.onerror = () => loadDemoData();

    // Load existing referrals from API
    loadReferrals(hid);
  }

  async function loadReferrals(hid) {
    try {
      const res = await fetch(`${API}/api/referrals/?hospital_id=${hid}`);
      const data = await res.json();
      referrals = data;
      
      // --- NEW: Calculate stats based on loaded database records ---
      counts.CRITICAL = 0;
      counts.HIGH = 0;
      counts.MEDIUM = 0;
      counts.TOTAL = data.length;

      data.forEach(r => {
        if (r.priority === 'CRITICAL') counts.CRITICAL++;
        if (r.priority === 'HIGH') counts.HIGH++;
        if (r.priority === 'MEDIUM') counts.MEDIUM++;
      });
      
      updateStats(); // Update the UI cards at the top
      renderTable(); // Render the rows below
      
    } catch(e) { loadDemoData(); }
  }

  function loadDemoData() {
    referrals = [
      { id:'REF-20240915-A1B2', patient_id:'Ramaiah, 62', village:'Kodangal', category:'cardiac', priority:'CRITICAL', specialist:'Cardiology', status:'PENDING' },
      { id:'REF-20240915-C3D4', patient_id:'Savitri, 28', village:'Marpally', category:'obstetric', priority:'HIGH', specialist:'Obstetrics', status:'ACCEPTED' },
      { id:'REF-20240915-E5F6', patient_id:'Venkat, 45', village:'Pargi', category:'trauma', priority:'MEDIUM', specialist:'Surgery', status:'IN_TRANSIT' },
    ];
    counts.CRITICAL = 1; counts.HIGH = 1; counts.MEDIUM = 1; counts.TOTAL = 3;
    updateStats();
    renderTable();
  }

  function handleNewReferral(msg) {
    alertCount++;
    document.getElementById('alertCount').textContent = alertCount;
    counts[msg.priority] = (counts[msg.priority] || 0) + 1;
    counts.TOTAL++;
    updateStats();

    // Play alert sound cue (visual flash instead)
    if (msg.priority === 'CRITICAL') document.body.style.outline = '3px solid #da3633';
    setTimeout(() => document.body.style.outline = 'none', 800);

    // Add to referral list
    referrals.unshift({
      id: msg.referral_id,
      patient_id: `${msg.patient.name}, ${msg.patient.age}`,
      village: msg.patient.village,
      category: msg.triage.category,
      priority: msg.priority,
      specialist: msg.triage.specialist_needed,
      status: 'PENDING',
    });
    renderTable();

    // Add alert card
    const feed = document.getElementById('alertFeed');
    const first = feed.querySelector('.empty-state');
    if (first) first.remove();

    const card = document.createElement('div');
    card.className = `alert-card ${msg.priority}`;
    card.id = `alert-${msg.referral_id}`; // ID added so we can remove it on click
    card.innerHTML = `
      <div class="ticket">
        ${msg.referral_id}
        <span class="doc-info">👨‍⚕️ ${msg.triage.specialist_needed}</span>
      </div>
      <div class="patient-name">${msg.patient.name}, ${msg.patient.age} · ${msg.patient.gender}</div>
      <div class="detail">📍 ${msg.patient.village} &nbsp;|&nbsp; 🏷 ${msg.triage.category}</div>
      ${msg.triage.needs_icu ? '<span class="icu-tag">⚠ ICU Required</span>' : ''}
      <div class="alert-time">${new Date().toLocaleTimeString()}</div>
      
      <!-- Action Buttons -->
      <div class="action-buttons">
        <button class="btn-icon accept" onclick="handleAlertAction('${msg.referral_id}', 'ACCEPTED')">✅ Accept</button>
        <button class="btn-icon reject" onclick="handleAlertAction('${msg.referral_id}', 'CANCELLED')">❌ Reject</button>
      </div>
    `;
    feed.prepend(card);
  }

  async function handleAlertAction(id, newStatus) {
    // 1. Tell backend to update status
    try {
      await fetch(`${API}/api/referrals/${id}/status`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status: newStatus, notes: `Updated from live alert panel` })
      });
    } catch(e) {}
    
    // 2. Remove the card from the Live Alert feed
    const card = document.getElementById(`alert-${id}`);
    if (card) {
       card.style.opacity = '0';
       setTimeout(() => card.remove(), 300);
    }
    
    // 3. Update the main table visually
    const r = referrals.find(x => x.id === id);
    if (r) { r.status = newStatus; renderTable(); }
    
    // 4. Decrease the red alert counter
    if (alertCount > 0) {
      alertCount--;
      document.getElementById('alertCount').textContent = alertCount;
    }
  }

  function handleStatusUpdate(msg) {
    const r = referrals.find(x => x.id === msg.referral_id);
    if (r) { r.status = msg.new_status; renderTable(); }
  }

  function updateStats() {
    document.getElementById('statCritical').textContent = counts.CRITICAL || 0;
    document.getElementById('statHigh').textContent = counts.HIGH || 0;
    document.getElementById('statMedium').textContent = counts.MEDIUM || 0;
    document.getElementById('statTotal').textContent = counts.TOTAL || 0;
  }

  async function acceptReferral(id) {
    try {
      await fetch(`${API}/api/referrals/${id}/status`, {
        method: 'PATCH',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ status: 'ACCEPTED', notes: 'Accepted via dashboard' })
      });
    } catch(e) {}
    const r = referrals.find(x => x.id === id);
    if (r) { r.status = 'ACCEPTED'; renderTable(); }
  }

  function renderTable() {
    const tbody = document.getElementById('referralTableBody');
    if (!referrals.length) {
      tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No referrals yet</td></tr>';
      return;
    }
    tbody.innerHTML = referrals.map(r => `
      <tr>
        <td style="font-family:monospace;font-size:.8rem">${r.id}</td>
        <td>${r.patient_id || r.patient?.name || '—'}</td>
        <td>${r.village || r.patient?.village || '—'}</td>
        <td>${r.category || r.triage?.category || '—'}</td>
        <td><span class="badge ${r.priority}">${r.priority}</span></td>
        <td>${r.specialist || r.triage?.specialist_needed || '—'}</td>
        <td><span class="status-badge">${r.status}</span></td>
        <td>${r.status === 'PENDING' ? `<button class="btn-accept" onclick="acceptReferral('${r.id}')">Accept</button>` : '—'}</td>
      </tr>
    `).join('');
  }

  // Auto-connect on load
  connectWS();
</script>
</body>
</html>
